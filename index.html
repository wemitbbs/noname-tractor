    <title>WeMitBBS 双升</title>
    <!-- 1. 最先加载版本号文件 -->
    <script src="game/update.js"></script>
    <script>
        // 核心修复：立即提取版本号。因为 game.js 加载后会 delete window.noname_update，
        // 如果等到 window.load 事件再提取，该变量已经不存在了，导致 swVersion 变成 Date.now()。
        window.swVersion = (window.noname_update && window.noname_update.update) ? window.noname_update.update : Date.now();

        // 核心优化：全自动启动守护进程 (Bootstrap Watchdog)
        window.bootstrapWatchdog = setTimeout(function() {
            if (!window.noname_inited) {
                console.error("启动超时：正在尝试自动修复并重新加载...");
                localStorage.removeItem('noname_inited');
                location.reload();
            }
        }, 5000);

        // PWA Service Worker 注册：联动 update.js 的版本号
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                var swVersion = window.swVersion;
                navigator.serviceWorker.register('./sw.js?v=' + swVersion).then(reg => {
                    console.log('SW registered with version:', swVersion);
                }).catch(err => {
                    console.log('SW registration failed:', err);
                });
            });
        }

        // 核心优化：如果从 phpBB 跳转回来且带有 sid，静默清理 URL
        (function() {
            if (window.history.replaceState && window.location.search.indexOf('sid=') !== -1) {
                var newSearch = window.location.search.replace(/[?&]sid=[^&]*/g, '').replace(/^&/, '?');
                var newUrl = window.location.pathname + newSearch + window.location.hash;
                window.history.replaceState({}, document.title, newUrl);
            }
        })();
    </script>

    <style>
        * {
            touch-action: manipulation;

        /* 核心：针对移动端全屏模式的 UI 缩放优化 */
        @media screen and (max-width: 932px) and (orientation: landscape) {
            /* 针对 iPhone Pro Max 等主流横屏设备 */
            html {
                /* 利用 zoom 实现非破坏性整体缩放（Safari/Chrome 支持良好） */
                zoom: 0.6;
            }
            
            /* 如果是 PWA 模式启动（Standalone 或 Fullscreen），可以进一步微调 */
            @media (display-mode: standalone), (display-mode: fullscreen) {
                html {
                    zoom: 0.65;
                }
            }
        }

        @media screen and (max-width: 667px) and (orientation: landscape) {
            html {
                zoom: 0.55;
            }
        }
    </style>
